services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: notification-dynamodb
    expose:
      - "8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"

    working_dir: /home/dynamodblocal

    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"

  dynamo-init:
    image: amazon/aws-cli:latest
    container_name: notification-dynamodb-init

    depends_on:
      - dynamodb

    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ca-central-1

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        echo "Waiting for DynamoDB..."

        until aws dynamodb list-tables \
          --endpoint-url http://dynamodb:8000 \
          > /dev/null 2>&1
        do
          sleep 1
        done

        echo "DynamoDB is ready."

        aws dynamodb describe-table \
          --table-name Notifications \
          --endpoint-url http://dynamodb:8000 \
          > /dev/null 2>&1 \
        || \
        
        aws dynamodb create-table \
          --table-name Notifications \
          --attribute-definitions \
          AttributeName=PK,AttributeType=S \
          AttributeName=SK,AttributeType=S \
          AttributeName=Status,AttributeType=S \
          AttributeName=ReadyAt,AttributeType=N \
          --key-schema \
          AttributeName=PK,KeyType=HASH \
          AttributeName=SK,KeyType=RANGE \
          --global-secondary-indexes '[
          {
            "IndexName": "status-readyAt-index",
            "KeySchema": [
              {
                "AttributeName": "Status",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "ReadyAt",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ]' \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb:8000

        echo "DynamoDB initialization complete."

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    container_name: notification-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb

  notification-web:
    build:
      context: .
      dockerfile: notification-presentation-web/Dockerfile
    container_name: notification-web
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamo-init:
        condition: service_completed_successfully

  notification-dispatcher:
    build:
      context: .
      dockerfile: notification-presentation-dispatcher/Dockerfile
    container_name: notification-dispatcher
    environment:
      SPRING_PROFILES_ACTIVE: local
      DISPATCHER_INTERVAL_MS: 5000

      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

      SQS_ENDPOINT: http://elasticmq:9324
      SQS_DELIVERY_QUEUE_NAME: notification-delivery

      DYNAMODB_ENDPOINT: http://dynamodb:8000
    depends_on:
      dynamo-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: notification-elasticmq

    expose:
      - "9324"

    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf
      - elasticmq-data:/data

  elasticmq-ui:
    image: softwaremill/elasticmq-ui:1.7.1
    container_name: notification-elasticmq-ui

    ports:
      - "3000:3000"

    environment:
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

    depends_on:
      - elasticmq

  notification-worker:
    build:
      context: .
      dockerfile: notification-presentation-worker/Dockerfile
    container_name: notification-worker
    environment:
      SPRING_PROFILES_ACTIVE: local

      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

      SQS_ENDPOINT: http://elasticmq:9324
      SQS_DELIVERY_QUEUE_NAME: notification-delivery

      DYNAMODB_ENDPOINT: http://dynamodb:8000

      EMAIL_FROM_ADDRESS: sender@test.com

    depends_on:
      dynamo-init:
        condition: service_completed_successfully
volumes:
  elasticmq-data: