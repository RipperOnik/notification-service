spring:
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  application:
    name: notification-dispatcher

app:
  dynamodb:
    table-name: Notifications
  sqs:
    delivery-queue-name: ${SQS_DELIVERY_QUEUE_NAME:notification-delivery}

dispatcher:
  interval-ms: ${DISPATCHER_INTERVAL_MS:5000}